name: Deploy SlimeKit

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 1. Autentikasi GCP
      - name: Google Auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_CREDENTIALS }}'

      # 2. Build & Push Docker ke Artifact Registry
      - name: Docker Build & Push
        run: |
          gcloud auth configure-docker ${{ vars.GCP_REGION }}-docker.pkg.dev
          IMAGE_URL="${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.REPO_NAME }}/${{ vars.CLOUD_RUN_NAME }}:${{ github.sha }}"
          if [ -f Dockerfile.prod ]; then
            docker build -f Dockerfile.prod -t $IMAGE_URL .
          else
            docker build -f Dockerfile -t $IMAGE_URL .
          fi
          docker push $IMAGE_URL

      # 3. Deploy langsung ke Google Cloud Run
      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ vars.CLOUD_RUN_NAME }}
          region: ${{ vars.GCP_REGION }}
          image: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.REPO_NAME }}/${{ vars.CLOUD_RUN_NAME }}:${{ github.sha }}
          flags: '--allow-unauthenticated'

      # 4. Jalankan Migrasi Database
      - name: Run Database Migration
        run: |
          composer install --no-dev --optimize-autoloader
          php -r "
            \$env = sprintf(
                \"DB_CLIENT=%s\nDB_CONNECTION=%s\nDB_HOST=%s\nDB_PORT=%s\nDB_USER=%s\nDB_PASS=%s\nDB_NAME=%s\n\",
                '${{ vars.DB_CLIENT }}',
                '${{ vars.DB_CLIENT }}',
                '${{ vars.DB_HOST }}',
                '${{ vars.DB_PORT }}',
                '${{ vars.DB_USER }}',
                '${{ secrets.DB_PASS }}',
                '${{ vars.DB_NAME }}'
            );
            file_put_contents('.env', \$env);
          "
          composer migrate